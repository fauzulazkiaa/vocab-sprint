<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var key = 'vocabSprint.theme';
        var theme = 'light';
        try {
          var stored = localStorage.getItem(key);
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        root.style.backgroundColor = theme === 'dark' ? '#000000' : '#f5f5f7';
      })();
    </script>
    <title>Vocab Sprint — Oxford 3000</title>
    <meta name="description" content="Aplikasi sprint harian Oxford 3000 dengan spaced repetition, kuis adaptif, dan pelafalan audio." />
    <meta property="og:title" content="Vocab Sprint — Oxford 3000" />
    <meta property="og:description" content="Aplikasi sprint harian Oxford 3000 dengan spaced repetition, kuis adaptif, dan pelafalan audio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
